<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Discover how Nx. can run your user growth. Share your goals and the Nx. team will be in touch.">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://www.nxgrowth.ai/contact/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nx.">
    <meta property="og:title" content="Discover Nx.">
    <meta property="og:description" content="Discover how Nx. can run your user growth. Share your goals and the Nx. team will be in touch.">
    <meta property="og:url" content="https://www.nxgrowth.ai/contact/">
    <meta property="og:image" content="https://www.nxgrowth.ai/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <title>Discover Nx.</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="../assets/favicon.svg">
    <link rel="preload" href="../assets/fonts/roboto-slab-regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="../assets/styles.css">
    <script type="module" src="../assets/js/form.js"></script>
  </head>
  <body class="inner-page demo-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="page-header"><a class="brand" href="../" aria-label="Nx. home"><img src="../assets/logo.svg" alt="Nx." width="76" height="40"></a></header>
    <main id="main" class="demo-main">
      <section class="demo-content" aria-labelledby="demo-title">
        <h1 id="demo-title">Discover Nx.</h1>
        <form id="demo-form" novalidate>
          <div class="fields-grid">
            <div class="field"><label for="firstName"><span class="required-mark" aria-hidden="true">*</span> First Name</label><input id="firstName" name="firstName" autocomplete="given-name" required maxlength="100" aria-describedby="firstName-error"><span class="field-error" id="firstName-error" hidden></span></div>
            <div class="field"><label for="lastName"><span class="required-mark" aria-hidden="true">*</span> Last Name</label><input id="lastName" name="lastName" autocomplete="family-name" required maxlength="100" aria-describedby="lastName-error"><span class="field-error" id="lastName-error" hidden></span></div>
            <div class="field"><label for="title"><span class="required-mark" aria-hidden="true">*</span> Title</label><input id="title" name="title" autocomplete="organization-title" required maxlength="150" aria-describedby="title-error"><span class="field-error" id="title-error" hidden></span></div>
            <div class="field"><label for="companyName"><span class="required-mark" aria-hidden="true">*</span> Company Name</label><input id="companyName" name="companyName" autocomplete="organization" required maxlength="200" aria-describedby="companyName-error"><span class="field-error" id="companyName-error" hidden></span></div>
            <div class="field"><label for="companyWebsite"><span class="required-mark" aria-hidden="true">*</span> Company Website</label><input id="companyWebsite" name="companyWebsite" type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" required maxlength="500" aria-describedby="companyWebsite-error"><span class="field-error" id="companyWebsite-error" hidden></span></div>
            <div class="field"><label for="phoneNumber">Phone Number</label><input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel" maxlength="40" aria-describedby="phoneNumber-error"><span class="field-error" id="phoneNumber-error" hidden></span></div>
            <div class="field"><label for="email"><span class="required-mark" aria-hidden="true">*</span> Email Address</label><input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required maxlength="254" aria-describedby="email-error"><span class="field-error" id="email-error" hidden></span></div>
            <div class="field"><label for="referralSource"><span class="required-mark" aria-hidden="true">*</span> How did you hear about Nx.?</label><div class="select-wrap"><select id="referralSource" name="referralSource" required aria-describedby="referralSource-error"><option value="" disabled selected>Select an option</option><option value="search_engine">Search engine</option><option value="social_media">Social media</option><option value="referral">Friend or colleague</option><option value="event">Event or conference</option><option value="other">Other</option></select></div><span class="field-error" id="referralSource-error" hidden></span></div>
          </div>
          <div class="consent-field">
            <div class="consent-row"><input type="checkbox" id="communicationConsent" name="communicationConsent" required aria-describedby="communicationConsent-error"><label for="communicationConsent">I agree to receive other communications from Nx.. By clicking submit below, you agree to Nx.’s <a href="../privacy-policy/" target="_blank" rel="noopener">Privacy Policy<span class="sr-only"> (opens in a new tab)</span></a> and consent to Nx. storing and processing the personal information submitted.</label></div>
            <span class="field-error" id="communicationConsent-error" hidden></span>
          </div>
          <div id="form-message" class="form-message" role="alert" tabindex="-1" hidden></div>
          <button type="submit" id="submit-button" class="button button-primary submit-button"><span class="button-spinner" aria-hidden="true" hidden></span><span id="submit-label">Submit</span></button>
          <noscript><p class="noscript-message">Please enable JavaScript to submit this form, or email <a href="mailto:hello@nx-growth.com">hello@nx-growth.com</a>.</p></noscript>
        </form>
        <div class="success-state" id="success-state" role="status" tabindex="-1" hidden><h2>Thank you for your interest.</h2><p>Your request has been received. The Nx. team will be in touch.</p><a class="button button-secondary" href="../">Back to Home</a></div>
      </section>
    </main>
    <footer class="page-footer"><a href="../privacy-policy/" target="_blank" rel="noopener">Privacy Policy<span class="sr-only"> (opens in a new tab)</span></a></footer>
  </body>
</html>
