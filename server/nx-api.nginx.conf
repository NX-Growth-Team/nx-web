# Nx demo request API (Node service listening on 127.0.0.1:8787).
# Included from every server block that serves nx-web: IP access and https.
# proxy_pass keeps the original URI because it carries no trailing path.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 128k;
}
